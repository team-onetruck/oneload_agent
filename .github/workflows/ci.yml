# Tests the agent on its own and inside the current oneload-backend, then ships main to the server.
# Shipping = asking oneload-backend to pin this commit; its CI tests again and deploys to macserver.
# Everything here runs on GitHub-hosted runners: this repository is public.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as the backend image
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  backend:
    # Backend main with this commit swapped in for its pinned agent: the backend's own tests,
    # then scripts/check_backend_compat.py (copied contracts, shared map, API end to end).
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hangil
          POSTGRES_PASSWORD: hangil
          POSTGRES_DB: hangil_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U hangil" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hangil:hangil@localhost:54329/hangil_test
    steps:
      # Sibling folders, the layout check_backend_compat.py expects.
      - uses: actions/checkout@v4
        with:
          path: agent
      - uses: actions/checkout@v4
        with:
          repository: team-onetruck/oneload-backend
          path: oneload-backend
      - uses: actions/checkout@v4
        with:
          repository: team-onetruck/oneload-data
          path: oneload-data
      - uses: astral-sh/setup-uv@v6
      - name: Backend environment with this agent
        working-directory: oneload-backend
        run: |
          uv sync --frozen
          uv pip install --python .venv ../agent
      - name: Backend tests
        working-directory: oneload-backend
        run: uv run --no-sync pytest -q
      - name: Contract check
        run: oneload-backend/.venv/bin/python agent/scripts/check_backend_compat.py oneload-backend
      - name: End-to-end through the backend API
        run: oneload-backend/.venv/bin/python agent/scripts/check_backend_compat.py oneload-backend --e2e
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  deploy:
    needs: [test, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # oneload-backend/.github/workflows/agent-bump.yml pins this commit, then runs its CI / Deploy.
      - run: gh workflow run agent-bump.yml -R team-onetruck/oneload-backend -f sha="$GITHUB_SHA"
        env:
          # Fine-grained token limited to oneload-backend, Actions: read and write.
          GH_TOKEN: ${{ secrets.HANGIL_DEPLOY_TOKEN }}
